<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Savanna Brew Café.">
  <title>Savanna Brew Café | Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Savanna Brew Café</h1>
    <nav aria-label="Main navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="menu.html">Menu</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Find us</h2>
      <p>Address: Your street and town here</p>
      <p>Phone: 0700 000 000</p>
      <p>Email: hello@example.com</p>
    </section>

    <section>
      <h2>Send us a message</h2>
      <form action="#" method="post">
        <label for="name">Your name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email address</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit">Send message</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Savanna Brew Café. All rights reserved.</p>
  </footer>

</body>
</html>
